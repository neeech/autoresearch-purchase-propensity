[project]
name = "autoresearch-purchase-propensity"
version = "0.1.0"
description = "Simple autoresearch loop for session purchase propensity"
readme = "README.md"
authors = [
    { name = "manu-horn", email = "manuhorn1910@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "scikit-learn>=1.9.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
]

[project.scripts]
autoresearch = "autoresearch_purchase_propensity.research:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
